<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cross.porn – Premium Video Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ░░ SPLASH SCREEN ░░ -->
  <div id="splash-screen">
    <img src="load_splash.png" alt="Loading…" />
  </div>

  <!-- ░░ 18+ AGE GATE ░░ -->
  <div id="age-gate" class="overlay hidden">
    <div class="gate-box glass">
      <div class="gate-logo">🔞</div>
      <h2>Age Verification</h2>
      <p>This website contains adult content. You must be 18 years or older to enter.</p>
      <div class="gate-actions">
        <button id="btn-over18" class="btn-primary">I am 18+ — Enter</button>
        <button id="btn-under18" class="btn-secondary">I am Under 18 — Exit</button>
      </div>
    </div>
  </div>

  <!-- ░░ AUTH MODAL ░░ -->
  <div id="auth-modal" class="overlay hidden">
    <div class="modal-box glass">
      <button class="modal-close" id="auth-close">✕</button>
      <div id="auth-tabs">
        <button class="tab-btn active" data-tab="login">Login</button>
        <button class="tab-btn" data-tab="register">Register</button>
      </div>

      <div id="tab-login" class="tab-content active">
        <h3>Welcome Back</h3>
        <input type="email" id="login-email" placeholder="Email" class="input-field" />
        <input type="password" id="login-password" placeholder="Password" class="input-field" />
        <button id="btn-login" class="btn-primary full-w">Sign In</button>
        <p id="login-error" class="error-msg"></p>
      </div>

      <div id="tab-register" class="tab-content">
        <h3>Create Account</h3>
        <input type="text" id="reg-username" placeholder="Username" class="input-field" />
        <input type="email" id="reg-email" placeholder="Email" class="input-field" />
        <input type="password" id="reg-password" placeholder="Password (min 6 chars)" class="input-field" />
        <button id="btn-register" class="btn-primary full-w">Register</button>
        <p id="reg-error" class="error-msg"></p>
      </div>
    </div>
  </div>

  <!-- ░░ PROFILE / ADMIN PANEL ░░ -->
  <div id="profile-modal" class="overlay hidden">
    <div class="modal-box glass wide">
      <button class="modal-close" id="profile-close">✕</button>
      <!-- Normal user view -->
      <div id="user-panel">
        <div class="profile-header">
          <div id="avatar-display" class="avatar-big">😀</div>
          <div>
            <h3 id="display-username">User</h3>
            <span id="display-email" class="muted"></span>
          </div>
        </div>
        <div class="section-label">Choose Avatar</div>
        <div id="emoji-picker" class="emoji-grid"></div>
        <input type="text" id="update-username" placeholder="New Username" class="input-field" />
        <button id="btn-update-profile" class="btn-primary">Save Profile</button>
        <div class="section-label" style="margin-top:18px;">Watch History</div>
        <div id="history-list" class="history-list"></div>
        <button id="btn-clear-history" class="btn-secondary" style="margin-top:8px;">🗑 Clear History</button>
        <button id="btn-logout" class="btn-danger" style="margin-top:18px;">Sign Out</button>
      </div>

      <!-- Admin panel -->
      <div id="admin-panel" class="hidden">
        <h3 class="gradient-text admin-title">⚙️ Admin Dashboard</h3>
        <div class="admin-tabs">
          <button class="atab active" data-atab="add-video">Add Video</button>
          <button class="atab" data-atab="manage-tags">Tags</button>
          <button class="atab" data-atab="manage-users">Users</button>
        </div>

        <!-- Add Video -->
        <div id="atab-add-video" class="atab-content active">
          <input type="text" id="a-title" placeholder="Video Title" class="input-field" />
          <input type="url" id="a-thumb" placeholder="Thumbnail URL" class="input-field" />
          <input type="url" id="a-embed" placeholder="Embed URL (iframe src)" class="input-field" />
          <input type="url" id="a-target" placeholder="Target URL (redirect)" class="input-field" />
          <input type="text" id="a-tags" placeholder="Tags (comma-sep): #4k, #desi" class="input-field" />
          <button id="btn-add-video" class="btn-primary">➕ Add Video</button>
          <p id="add-video-msg" class="success-msg"></p>
        </div>

        <!-- Manage Tags -->
        <div id="atab-manage-tags" class="atab-content">
          <p class="muted">Edit home page tags (comma-separated):</p>
          <textarea id="tags-textarea" class="input-field textarea" rows="4"></textarea>
          <button id="btn-save-tags" class="btn-primary">💾 Save Tags</button>
          <p id="tags-msg" class="success-msg"></p>
        </div>

        <!-- Manage Users -->
        <div id="atab-manage-users" class="atab-content">
          <div id="users-list" class="users-list"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- ░░ TOPBAR ░░ -->
  <header id="topbar" class="glass">
    <div class="topbar-left">
      <img src="logo.png" alt="Logo" class="topbar-logo" />
      <span class="brand-text gradient-text">Cross.porn</span>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="btn-search-toggle" title="Search">🔎</button>
      <button class="icon-btn" id="btn-profile-toggle" title="Profile">👤</button>
    </div>
  </header>

  <!-- ░░ SEARCH BAR ░░ -->
  <div id="search-bar" class="glass hidden">
    <input type="text" id="search-input" placeholder="Search videos…" />
    <button id="btn-search-go" class="btn-primary sm">Search</button>
    <button id="btn-search-clear" class="btn-secondary sm">✕</button>
  </div>

  <!-- ░░ MAIN CONTENT ░░ -->
  <main id="main-content">

    <!-- Tags -->
    <div id="tags-section" class="glass">
      <div id="tags-row" class="tags-row"></div>
      <button id="btn-view-more-tags" class="tag-pill view-more hidden">View More ▾</button>
    </div>

    <!-- Ad Banner placeholder -->
    <div id="ad-banner" class="glass ad-banner">
      <span>📢 Advertisement Placeholder</span>
    </div>

    <!-- Video Grid -->
    <div id="video-grid" class="video-grid"></div>

    <!-- Pagination -->
    <div id="pagination" class="pagination"></div>

  </main>

  <!-- Firebase SDKs (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script src="firebase-app.js"></script>
  <script src="main.js"></script>
  <script src="admin.js"></script>
</body>
</html>
